[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-erp-data-migration"
version = "1.0.0"
description = "Declarative CRM data migration toolkit: YAML mappings, mandatory dry-run, batched loading into a Dataverse-style API (synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ayman Bara", email = "aymanbara2005@gmail.com" }]
keywords = ["crm", "migration", "etl", "data-quality", "dataverse"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "types-python-dateutil>=2.9,<3.0",
]

[project.scripts]
keystone = "keystone.cli:app"

[project.urls]
Repository = "https://github.com/legend-cell05/crm-erp-data-migration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keystone = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "PTH", "RUF", "ASYNC"]
ignore = [
    "E501",  # the formatter owns line length
    "B008",  # FastAPI dependency injection puts calls in defaults
]

[tool.ruff.lint.per-file-ignores]
# N818 wants every exception to end in "Error". MappingViolation and
# RecordRejected read better at the call site, and their base class already
# says what they are.
"src/keystone/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
# No `python_version` pin: pinning it to the oldest supported runtime makes
# mypy apply that version's grammar to the dependencies' stubs too, and some
# of them ship PEP 695 syntax that only parses under 3.12. Mypy follows the
# interpreter it runs under; 3.11 is exercised by the test matrix.
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live PostgreSQL (set KEYSTONE_RUN_INTEGRATION=1)",
]

[tool.coverage.run]
source = ["src/keystone"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
